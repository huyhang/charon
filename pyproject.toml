[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "charon"
version = "0.1.0"
description = "API-first torrent download and post-processing service for Synology NAS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "regex>=2024.11.6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["charon*", "fake_ds*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["e2e: end-to-end tests against running services"]

# `make py-coverage` measures the unit and in-process e2e suites together.
[tool.coverage.run]
source = ["charon", "fake_ds"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
